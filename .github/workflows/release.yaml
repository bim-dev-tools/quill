name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build binary
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" == "windows" ]; then EXT=".exe"; fi
            VERSION="${{ github.ref_name }}"
            OUT="dist/quill_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}"
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-X 'main.version=${VERSION}'" -o "$OUT" ./main.go
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quill_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/quill_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
